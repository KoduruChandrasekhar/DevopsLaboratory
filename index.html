<!DOCTYPE html>
<html>
<head>
  <title>Event Registration</title>
  <style>
    body {
      font-family: Arial;
      background-color: lightblue;
    }
    .box {
      width: 300px;
      margin: 50px auto;
      padding: 20px;
      background-color: white;
      border-radius: 10px;
    }
    input, button {
       width: 100%;
       padding: 8px;
        margin: 5px 0;
        box-sizing: border-box;
    }
    button {
      background-color: blue;
      color: white;
      border: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Event Registration</h2>
    <form id="form" onsubmit="register(); return false;">
      Name: <input id="name" required>
      Email: <input id="email" type="email" required>
      Phone: <input id="phone" pattern="[0-9]{10}" required>
      <button id="btn">Register</button>
    </form>
    <p id="message"></p>
  </div>

  <script>
    function register() {
      var name = document.getElementById("name").value;
      document.getElementById("message").innerHTML = "Registration Successful! Welcome " + name;
      document.getElementById("message").style.color = "green";
      document.getElementById("form").reset();
    }
  </script>
</body>
</html>
