<!DOCTYPE html>
<html>
<head>
  <title>Event Registration</title>
  <style>
    body {
      font-family: Arial;
      background-color: lightblue;
    }

    .box {
      width: 300px;
      margin: 50px auto;
      padding: 20px;
      background-color: white;
      border-radius: 10px;
    }

    input, button {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      box-sizing: border-box;
    }

    button {
      background-color: rgb(35, 35, 183);
      color: white;
      border: none;
    }

    #message {
      font-size: 30px;
      color: green;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Event Registration</h2>

    <form onsubmit="register(); return false;">
      Name: <input id="name" required>
      Email: <input id="email" type="email" required>
      Phone: <input id="phone" pattern="[0-9]{10}" required>
      <button id="btn">Register</button>
    </form>

    <p id="message"></p>
  </div>

  <script>
    function register() {
      document.body.style.backgroundColor = "lightgreen";
      document.getElementById("message").innerHTML = "Registration Successful!";
    }
  </script>
</body>
</html>
